# docker-compose.local.yaml
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    container_name: eve-mapper-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5175:5175"
    networks:
      - eve-network
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    container_name: eve-mapper-backend
    volumes:
      - ./backend:/app
    ports:
      - "7777:7777"
    env_file:
      - ./backend/.env.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - eve-network

  redis:
    image: redis:7-alpine
    container_name: eve-mapper-redis
    ports:
      - "6379:6379"
    networks:
      - eve-network

  db:
    image: postgres:15-alpine
    container_name: eve-mapper-db
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-eve_mapper}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-eve_mapper}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eve-network

networks:
  eve-network:
    driver: bridge

volumes:
  postgres_data:
